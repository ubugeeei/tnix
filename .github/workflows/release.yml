name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-assets:
    name: Build Release Assets (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
            label: linux-x64
            archive: tnix-${{ github.ref_name }}-linux-x64.tar.gz
            sha: tnix-${{ github.ref_name }}-linux-x64.sha256
          - os: macos-latest
            label: macos-arm64
            archive: tnix-${{ github.ref_name }}-macos-arm64.tar.gz
            sha: tnix-${{ github.ref_name }}-macos-arm64.sha256
    steps:
      - name: Check out sources (Blacksmith)
        if: ${{ startsWith(matrix.os, 'blacksmith-') }}
        uses: useblacksmith/checkout@6210cff9085b85e9591891547800ae805be7e4da # v1
        with:
          persist-credentials: false

      - name: Check out sources
        if: ${{ !startsWith(matrix.os, 'blacksmith-') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mount Cabal package cache
        if: ${{ startsWith(matrix.os, 'blacksmith-') }}
        uses: useblacksmith/stickydisk@74f3f01ab1392726dd6ee06904f0452b0ec1e151 # v1.4.0
        with:
          key: ${{ github.repository }}-cabal-packages-${{ runner.os }}-${{ hashFiles('cabal.project', 'packages/*/*.cabal') }}
          path: ~/.cabal/packages

      - name: Mount Cabal store
        if: ${{ startsWith(matrix.os, 'blacksmith-') }}
        uses: useblacksmith/stickydisk@74f3f01ab1392726dd6ee06904f0452b0ec1e151 # v1.4.0
        with:
          key: ${{ github.repository }}-cabal-store-${{ runner.os }}-${{ hashFiles('cabal.project', 'packages/*/*.cabal') }}
          path: ~/.cabal/store

      - name: Cache Cabal dependencies
        if: ${{ !startsWith(matrix.os, 'blacksmith-') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
          key: ${{ runner.os }}-cabal-${{ hashFiles('cabal.project', 'packages/*/*.cabal') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: Resolve pnpm store path
        id: pnpm-store
        run: |
          store_path="$(nix develop --accept-flake-config --command pnpm store path --silent | tail -n 1)"
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - name: Mount pnpm store
        if: ${{ startsWith(matrix.os, 'blacksmith-') }}
        uses: useblacksmith/stickydisk@74f3f01ab1392726dd6ee06904f0452b0ec1e151 # v1.4.0
        with:
          key: ${{ github.repository }}-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: ${{ steps.pnpm-store.outputs.path }}

      - name: Cache pnpm store
        if: ${{ !startsWith(matrix.os, 'blacksmith-') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install workspace dependencies
        run: nix develop --accept-flake-config --command pnpm install --frozen-lockfile

      - name: Prime the Cabal package index
        run: nix develop --accept-flake-config --command cabal update

      - name: Validate release metadata
        run: nix develop --accept-flake-config --command vp run check:versions

      - name: Build release binaries
        env:
          REF_NAME: ${{ github.ref_name }}
        run: nix develop --accept-flake-config --command node --experimental-strip-types ./scripts/package-release.ts "$REF_NAME" "${{ matrix.label }}" "${{ matrix.archive }}" "${{ matrix.sha }}"

      - name: Smoke test packaged binaries
        run: |
          set -euo pipefail
          stage_dir="$(mktemp -d)"
          tar -C "$stage_dir" -xzf "${{ matrix.archive }}"
          archive_root="$(find "$stage_dir" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          tnix_bin="$archive_root/bin/tnix"
          lsp_bin="$archive_root/bin/tnix-lsp"

          # Version probes: confirms the binaries actually start and load their data files.
          "$tnix_bin" --version
          "$lsp_bin" --version

          # Functional smoke against the in-tree examples and dogfood corpora, so a
          # binary that links but can't type-check anything fails the release.
          "$tnix_bin" check ./examples/main.tnix
          "$tnix_bin" check-project ./examples --format json >/dev/null
          "$tnix_bin" check ./dogfood/flake-surface.tnix

          # Minimal JSON-RPC handshake against the packaged LSP. We send
          # `initialize`, then `exit` (which the server handles by exiting
          # cleanly), and assert the server emits at least one JSON-RPC
          # response before terminating.
          lsp_log="$(mktemp)"
          send_message() {
            local body="$1"
            printf 'Content-Length: %s\r\n\r\n%s' "${#body}" "$body"
          }
          {
            send_message '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}'
            send_message '{"jsonrpc":"2.0","method":"exit","params":null}'
          } | "$lsp_bin" --stdio >"$lsp_log" 2>&1 || true
          if ! grep -q '"jsonrpc":"2.0"' "$lsp_log"; then
            echo "tnix-lsp did not emit any JSON-RPC response during smoke test" >&2
            cat "$lsp_log" >&2
            exit 1
          fi

      - name: Verify release checksum
        run: nix develop --accept-flake-config --command node --experimental-strip-types ./scripts/package-release.ts verify-checksum "${{ matrix.sha }}"

      - name: Generate SBOM for release archive
        id: sbom
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.20.5
        with:
          file: ${{ matrix.archive }}
          format: cyclonedx-json
          output-file: tnix-${{ github.ref_name }}-${{ matrix.label }}.cdx.json
          artifact-name: sbom-${{ matrix.label }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest release archive, checksum, and SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ matrix.archive }}
            ${{ matrix.sha }}
            tnix-${{ github.ref_name }}-${{ matrix.label }}.cdx.json

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.label }}
          if-no-files-found: error
          path: |
            ./${{ matrix.archive }}
            ./${{ matrix.sha }}
            ./tnix-${{ github.ref_name }}-${{ matrix.label }}.cdx.json
          retention-days: 7

  build-vscode-extension:
    name: Build VS Code Extension
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Check out sources (Blacksmith)
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/checkout@6210cff9085b85e9591891547800ae805be7e4da # v1
        with:
          persist-credentials: false

      - name: Check out sources
        if: ${{ !startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve pnpm store path
        id: pnpm-store
        run: |
          store_path="$(nix develop --accept-flake-config --command pnpm store path --silent | tail -n 1)"
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - name: Mount pnpm store
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/stickydisk@74f3f01ab1392726dd6ee06904f0452b0ec1e151 # v1.4.0
        with:
          key: ${{ github.repository }}-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: ${{ steps.pnpm-store.outputs.path }}

      - name: Cache pnpm store
        if: ${{ !startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install workspace dependencies
        run: nix develop --accept-flake-config --command pnpm install --frozen-lockfile

      - name: Validate release metadata
        run: nix develop --accept-flake-config --command vp run check:versions

      - name: Package VS Code extension
        run: |
          set -euo pipefail
          nix develop --accept-flake-config --command pnpm --filter tnix build
          nix develop --accept-flake-config --command pnpm --filter tnix exec vsce package --no-dependencies --out "../../tnix-vscode-$REF_NAME.vsix"

      - name: Generate SBOM for VS Code extension
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.20.5
        with:
          file: ./tnix-vscode-${{ env.REF_NAME }}.vsix
          format: cyclonedx-json
          output-file: ./tnix-vscode-${{ env.REF_NAME }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest VS Code extension and SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ./tnix-vscode-${{ env.REF_NAME }}.vsix
            ./tnix-vscode-${{ env.REF_NAME }}.cdx.json

      - name: Upload VS Code extension
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-vscode
          if-no-files-found: error
          path: |
            ./tnix-vscode-${{ github.ref_name }}.vsix
            ./tnix-vscode-${{ github.ref_name }}.cdx.json
          retention-days: 7

  publish-release:
    name: Publish Release
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    needs:
      - build-assets
      - build-vscode-extension
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./release-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ./release-artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-vscode-marketplaces:
    name: Publish VS Code Extension
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs:
      - build-vscode-extension
      - publish-release
    permissions:
      contents: read
    env:
      REF_NAME: ${{ github.ref_name }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Check out sources (Blacksmith)
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/checkout@6210cff9085b85e9591891547800ae805be7e4da # v1
        with:
          persist-credentials: false

      - name: Check out sources
        if: ${{ !startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve pnpm store path
        id: pnpm-store
        run: |
          store_path="$(nix develop --accept-flake-config --command pnpm store path --silent | tail -n 1)"
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - name: Mount pnpm store
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/stickydisk@74f3f01ab1392726dd6ee06904f0452b0ec1e151 # v1.4.0
        with:
          key: ${{ github.repository }}-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: ${{ steps.pnpm-store.outputs.path }}

      - name: Cache pnpm store
        if: ${{ !startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install workspace dependencies
        run: nix develop --accept-flake-config --command pnpm install --frozen-lockfile

      - name: Download VS Code extension
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-vscode
          path: ./release-vscode

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: nix develop --accept-flake-config --command pnpm --filter tnix exec vsce publish --packagePath "./release-vscode/tnix-vscode-$REF_NAME.vsix" --pat "$VSCE_PAT"

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: nix develop --accept-flake-config --command pnpm --filter tnix exec ovsx publish "./release-vscode/tnix-vscode-$REF_NAME.vsix" -p "$OVSX_PAT"

      - name: Skip marketplace publish
        if: ${{ env.VSCE_PAT == '' && env.OVSX_PAT == '' }}
        run: echo "No VSCE_PAT or OVSX_PAT secret configured; skipping marketplace publish."
