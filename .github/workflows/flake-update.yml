name: Flake update

# Dependabot does not support the Nix flake (which pins the Haskell toolchain
# and nixpkgs). This workflow refreshes flake.lock on a cadence and opens a PR,
# so the Haskell/Nix dependency surface stays current alongside the
# dependabot-managed github-actions / npm / cargo ecosystems.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  update-flake-lock:
    name: Update flake.lock
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out sources (Blacksmith)
        if: ${{ startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: useblacksmith/checkout@6210cff9085b85e9591891547800ae805be7e4da # v1

      - name: Check out sources
        if: ${{ !startsWith(vars.CI_RUNNER || 'ubuntu-latest', 'blacksmith-') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update flake.lock
        run: nix flake update --accept-flake-config

      - name: Open pull request if flake.lock changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- flake.lock; then
            echo "flake.lock is already up to date."
            exit 0
          fi
          branch="automation/flake-update-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add flake.lock
          git commit -m "chore(deps): update flake.lock"
          git push --set-upstream origin "$branch"
          gh pr create \
            --title "chore(deps): update flake.lock" \
            --body "Automated weekly \`nix flake update\`. Review the input revision changes before merging." \
            --base "${GITHUB_REF_NAME}"
          # Labelling is cosmetic: a missing label must not strand the branch we
          # just pushed without a pull request.
          gh pr edit "$branch" --add-label dependencies \
            || echo "::warning::could not add the 'dependencies' label"
